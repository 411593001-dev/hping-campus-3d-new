
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高師大 3D 校園探索</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
}

#game {
  width: 100vw;
  height: 100vh;
}

#ui {
  position: fixed;
  top: 18px;
  left: 18px;
  padding: 16px 20px;
  background: rgba(0,0,0,0.65);
  color: white;
  border-radius: 12px;
  z-index: 10;
  line-height: 1.6;
}

#ui h2 {
  margin: 0 0 8px;
}

#message {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  z-index: 10;
  text-align: center;
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 5;
}

#ui p {
  margin: 3px 0;
}
</style>
</head>

<body>

<div id="ui">
  <h2>🎓 高師大校園探索</h2>
  <p>W / ↑：前進</p>
  <p>S / ↓：後退</p>
  <p>A / ←：左移</p>
  <p>D / →：右移</p>
  <p>滑鼠右鍵：旋轉視角</p>
  <p>Shift：加速</p>
  <p id="position">探索中...</p>
</div>

<div id="message">
  按住滑鼠右鍵並移動，可以旋轉攝影機。
</div>

<div id="crosshair"></div>
<div id="game"></div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ====================================
// 1. 建立場景
// ====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  60,
  180
);

// ====================================
// 2. 建立攝影機
// ====================================

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

// ====================================
// 3. 建立渲染器
// ====================================

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById('game').appendChild(
  renderer.domElement
);

// ====================================
// 4. 光線
// ====================================

const ambientLight = new THREE.HemisphereLight(
  0xffffff,
  0x668855,
  2
);

scene.add(ambientLight);

const sunlight = new THREE.DirectionalLight(
  0xffffff,
  2
);

sunlight.position.set(30, 50, 20);

sunlight.castShadow = true;

sunlight.shadow.mapSize.set(2048, 2048);

scene.add(sunlight);

// ====================================
// 5. 草地
// ====================================

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({
    color: 0x78b86b
  })
);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);

// ====================================
// 6. 道路
// ====================================

function createRoad(x, z, width, length) {

  const road = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      0.05,
      length
    ),
    new THREE.MeshStandardMaterial({
      color: 0x555555
    })
  );

  road.position.set(x, 0.01, z);

  scene.add(road);

}

createRoad(0, 0, 12, 100);

createRoad(0, 0, 100, 12);

// ====================================
// 7. 建築物
// ====================================

const buildings = [];

function createBuilding(
  name,
  x,
  z,
  width,
  height,
  depth,
  color
) {

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    new THREE.MeshStandardMaterial({
      color: color
    })
  );

  building.position.set(
    x,
    height / 2,
    z
  );

  building.castShadow = true;

  building.receiveShadow = true;

  building.userData.name = name;

  scene.add(building);

  buildings.push({
    x,
    z,
    width,
    depth
  });

  // 建築標示

  const canvas = document.createElement('canvas');

  canvas.width = 512;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';

  ctx.fillRect(0, 0, 512, 128);

  ctx.fillStyle = '#222222';

  ctx.font = 'bold 48px Arial';

  ctx.textAlign = 'center';

  ctx.fillText(
    name,
    256,
    80
  );

  const texture = new THREE.CanvasTexture(canvas);

  const label = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: texture
    })
  );

  label.position.set(
    x,
    height + 2,
    z
  );

  label.scale.set(8, 2, 1);

  scene.add(label);

  return building;

}

// 測試建築

createBuilding(
  '校園行政中心',
  -15,
  -15,
  12,
  8,
  10,
  0xffd166
);

createBuilding(
  '教學大樓',
  15,
  -15,
  12,
  10,
  10,
  0xff9f80
);

createBuilding(
  '圖書館',
  -15,
  15,
  12,
  9,
  10,
  0x8ecae6
);

createBuilding(
  '學生活動中心',
  15,
  15,
  12,
  7,
  10,
  0xcdb4db
);

// ====================================
// 8. 建立玩家
// ====================================

const player = new THREE.Group();

// 身體

const body = new THREE.Mesh(
  new THREE.BoxGeometry(
    1,
    1.5,
    0.6
  ),
  new THREE.MeshStandardMaterial({
    color: 0x4287f5
  })
);

body.position.y = 1.5;

body.castShadow = true;

player.add(body);

// 頭部

const head = new THREE.Mesh(
  new THREE.SphereGeometry(
    0.45,
    24,
    24
  ),
  new THREE.MeshStandardMaterial({
    color: 0xffd2a6
  })
);

head.position.y = 2.6;

head.castShadow = true;

player.add(head);

// 黃色背包

const backpack = new THREE.Mesh(
  new THREE.BoxGeometry(
    0.7,
    0.9,
    0.35
  ),
  new THREE.MeshStandardMaterial({
    color: 0xffd700
  })
);

backpack.position.set(
  0,
  1.6,
  0.45
);

player.add(backpack);

// 玩家位置

player.position.set(
  0,
  0,
  0
);

scene.add(player);

// ====================================
// 9. 第三人稱攝影機設定
// ====================================

// 水平旋轉角度

let cameraYaw = 0;

// 上下旋轉角度

let cameraPitch = 0.25;

// 攝影機距離

const cameraDistance = 8;

// 攝影機高度中心

const cameraTargetHeight = 1.7;

// 滑鼠右鍵控制

let rightMouseDown = false;

// 滑鼠靈敏度

const mouseSensitivity = 0.004;

// ====================================

renderer.domElement.addEventListener(
  'contextmenu',
  (event) => {
    event.preventDefault();
  }
);

renderer.domElement.addEventListener(
  'mousedown',
  (event) => {
    if (event.button === 0) {
      rightMouseDown = true;

      document.getElementById(
        'message'
      ).textContent =
        '移動滑鼠，可以旋轉攝影機';
    }
  }
);

window.addEventListener(
  'mouseup',
  (event) => {
    if (event.button === 0) {
      rightMouseDown = false;

      document.getElementById(
        'message'
      ).textContent =
        '按住滑鼠左鍵並移動，可以旋轉攝影機';
    }
  }
);

window.addEventListener(
  'mousemove',
  (event) => {
    if (!rightMouseDown) return;

    cameraYaw -=
      event.movementX * mouseSensitivity;

    cameraPitch -=
      event.movementY * mouseSensitivity;

    cameraPitch = THREE.MathUtils.clamp(
      cameraPitch,
      -0.35,
      1.0
    );
  }
);


// ====================================
// 11. 鍵盤控制
// ====================================

const keys = {};

window.addEventListener(
  'keydown',
  (event) => {

    keys[event.key.toLowerCase()] = true;

  }
);

window.addEventListener(
  'keyup',
  (event) => {

    keys[event.key.toLowerCase()] = false;

  }
);

// ====================================
// 12. 建築碰撞
// ====================================

function checkCollision(nextX, nextZ) {

  const playerRadius = 0.8;

  for (const building of buildings) {

    const minX =
      building.x - building.width / 2 - playerRadius;

    const maxX =
      building.x + building.width / 2 + playerRadius;

    const minZ =
      building.z - building.depth / 2 - playerRadius;

    const maxZ =
      building.z + building.depth / 2 + playerRadius;

    if (
      nextX > minX &&
      nextX < maxX &&
      nextZ > minZ &&
      nextZ < maxZ
    ) {

      return true;

    }

  }

  return false;

}

// ====================================
// 13. 玩家移動
// ====================================

function movePlayer(delta) {

  const forward =
    keys['w'] || keys['arrowup'];

  const backward =
    keys['s'] || keys['arrowdown'];

  const left =
    keys['a'] || keys['arrowleft'];

  const right =
    keys['d'] || keys['arrowright'];

  const direction = new THREE.Vector3();

  // 前後方向

  if (forward) direction.z -= 1;

  if (backward) direction.z += 1;

  // 左右方向

  if (left) direction.x -= 1;

  if (right) direction.x += 1;

  // 沒有移動就結束

  if (direction.lengthSq() === 0) {

    return;

  }

  // 避免斜走比較快

  direction.normalize();

  // 根據攝影機方向旋轉

  direction.applyAxisAngle(
    new THREE.Vector3(0, 1, 0),
    cameraYaw
  );

  // 角色速度

  let speed = 5;

  if (keys['shift']) {

    speed = 9;

  }

  const distance = speed * delta;

  const moveX = direction.x * distance;

  const moveZ = direction.z * distance;

  // 分別測試 X 和 Z
  // 讓角色可以沿著建築邊緣移動

  const nextX = player.position.x + moveX;

  if (
    !checkCollision(
      nextX,
      player.position.z
    )
  ) {

    player.position.x = nextX;

  }

  const nextZ = player.position.z + moveZ;

  if (
    !checkCollision(
      player.position.x,
      nextZ
    )
  ) {

    player.position.z = nextZ;

  }

  // 角色朝向移動方向

  player.rotation.y = Math.atan2(
    direction.x,
    direction.z
  );

}

// ====================================
// 14. 更新攝影機
// ====================================

function updateCamera() {

  // 角色中心

  const target = new THREE.Vector3(
    player.position.x,
    cameraTargetHeight,
    player.position.z
  );

  // 攝影機方向

  const offset = new THREE.Vector3(
    0,
    0,
    cameraDistance
  );

  // 水平旋轉

  offset.applyAxisAngle(
    new THREE.Vector3(0, 1, 0),
    cameraYaw
  );

  // 上下旋轉

  offset.applyAxisAngle(
    new THREE.Vector3(1, 0, 0),
    cameraPitch
  );

  // 攝影機位置

  camera.position.copy(target).add(offset);

  // 攝影機看向角色

  camera.lookAt(target);

}

// ====================================
// 15. 遊戲主迴圈
// ====================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  // 避免切換視窗後突然移動太遠

  const delta = Math.min(
    clock.getDelta(),
    0.05
  );

  // 更新角色

  movePlayer(delta);

  // 更新攝影機

  updateCamera();

  // 顯示位置

  document.getElementById(
    'position'
  ).textContent =
    `位置：X ${player.position.x.toFixed(1)} / Z ${player.position.z.toFixed(1)}`;

  // 渲染

  renderer.render(
    scene,
    camera
  );

}

animate();

// ====================================
// 16. 視窗尺寸調整
// ====================================

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
