
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高師大 3D 校園探索</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      padding: 16px 20px;
      border-radius: 12px;
      z-index: 10;
    }

    #ui h2 {
      margin: 0 0 10px;
    }

    #ui p {
      margin: 6px 0;
    }

    #message {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div id="ui">
    <h2>🎓 高師大校園探索</h2>
    <p>W / ↑：前進</p>
    <p>S / ↓：後退</p>
    <p>A / ←：左移</p>
    <p>D / →：右移</p>
    <p id="position">探索中...</p>
  </div>

  <div id="message">
    歡迎來到高師大！使用方向鍵或 WASD 開始探索。
  </div>

  <div id="game"></div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // 建立場景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    // 建立攝影機
    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 7, 10);

    // 建立渲染器
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document.getElementById('game').appendChild(
      renderer.domElement
    );

    // 環境光
    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      2
    );

    scene.add(ambientLight);

    // 太陽光
    const sun = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    sun.position.set(10, 20, 10);
    scene.add(sun);

    // 草地
    const groundGeometry = new THREE.PlaneGeometry(
      200,
      200
    );

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x78b86b
    });

    const ground = new THREE.Mesh(
      groundGeometry,
      groundMaterial
    );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;

    scene.add(ground);

    // 建立道路
    function createRoad(x, z, width, length) {
      const geometry = new THREE.BoxGeometry(
        width,
        0.05,
        length
      );

      const material = new THREE.MeshStandardMaterial({
        color: 0x555555
      });

      const road = new THREE.Mesh(
        geometry,
        material
      );

      road.position.set(x, 0, z);
      scene.add(road);
    }

    createRoad(0, 0, 12, 100);
    createRoad(0, 0, 100, 12);

    // 建立校園建築
    function createBuilding(
      name,
      x,
      z,
      width,
      height,
      depth,
      color
    ) {
      const geometry = new THREE.BoxGeometry(
        width,
        height,
        depth
      );

      const material = new THREE.MeshStandardMaterial({
        color: color
      });

      const building = new THREE.Mesh(
        geometry,
        material
      );

      building.position.set(
        x,
        height / 2,
        z
      );

      building.userData.name = name;

      scene.add(building);

      // 建築標示
      const canvas = document.createElement('canvas');

      canvas.width = 512;
      canvas.height = 128;

      const context = canvas.getContext('2d');

      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, 512, 128);

      context.fillStyle = '#222222';
      context.font = 'bold 48px Arial';
      context.textAlign = 'center';

      context.fillText(
        name,
        256,
        80
      );

      const texture = new THREE.CanvasTexture(canvas);

      const labelMaterial = new THREE.SpriteMaterial({
        map: texture
      });

      const label = new THREE.Sprite(
        labelMaterial
      );

      label.position.set(
        x,
        height + 2,
        z
      );

      label.scale.set(8, 2, 1);

      scene.add(label);

      return building;
    }

    // 暫時使用測試建築
    createBuilding(
      '校園行政中心',
      -15,
      -15,
      12,
      8,
      10,
      0xffd166
    );

    createBuilding(
      '教學大樓',
      15,
      -15,
      12,
      10,
      10,
      0xff9f80
    );

    createBuilding(
      '圖書館',
      -15,
      15,
      12,
      9,
      10,
      0x8ecae6
    );

    createBuilding(
      '學生活動中心',
      15,
      15,
      12,
      7,
      10,
      0xcdb4db
    );

    // 建立玩家
    const player = new THREE.Group();

    // 身體
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1.5, 0.6),
      new THREE.MeshStandardMaterial({
        color: 0x4287f5
      })
    );

    body.position.y = 1.5;
    player.add(body);

    // 頭部
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 24, 24),
      new THREE.MeshStandardMaterial({
        color: 0xffd2a6
      })
    );

    head.position.y = 2.6;
    player.add(head);

    // 黃色背包
    const backpack = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 0.9, 0.35),
      new THREE.MeshStandardMaterial({
        color: 0xffd700
      })
    );

    backpack.position.set(0, 1.6, 0.45);
    player.add(backpack);

    scene.add(player);

    // 玩家初始位置
    player.position.set(0, 0, 0);

    // 按鍵狀態
    const keys = {};

    window.addEventListener('keydown', (event) => {
      keys[event.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    // 遊戲主迴圈
    function animate() {
      requestAnimationFrame(animate);

      const speed = 0.15;

      // 前後移動
      if (keys['w'] || keys['arrowup']) {
        player.position.z -= speed;
      }

      if (keys['s'] || keys['arrowdown']) {
        player.position.z += speed;
      }

      // 左右移動
      if (keys['a'] || keys['arrowleft']) {
        player.position.x -= speed;
      }

      if (keys['d'] || keys['arrowright']) {
        player.position.x += speed;
      }

      // 攝影機跟隨玩家
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 10;
      camera.position.y = 7;

      camera.lookAt(
        player.position.x,
        1,
        player.position.z
      );

      // 顯示玩家座標
      document.getElementById('position').textContent =
        `位置：X ${player.position.x.toFixed(1)} / Z ${player.position.z.toFixed(1)}`;

      renderer.render(scene, camera);
    }

    animate();

    // 視窗大小調整
    window.addEventListener('resize', () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

  </script>

</body>
</html>
